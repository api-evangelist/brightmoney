name: Brightmoney
description: Bright Money (Bright) is a San Francisco-based financial technology company
  that describes itself as the world's first AI Loan Assistant. Its consumer mobile app
  helps people pay off credit-card debt faster, build credit history, and access affordable
  credit through products including Bright Builder (a secured 0% APR credit line reported
  to the major bureaus), Bright Plan debt-payoff and budgeting, Smart Round-Ups automated
  savings, rent reporting, personal loans up to $10,000 through network partners, and cash
  advances up to $750 for all credit scores. Bright is a consumer-facing product and does
  not currently publish a public developer API or documentation.
